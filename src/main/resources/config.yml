# Server-wide caps on how many of each item can ever be created.
# Counts live in data.yml. Items count when crafted at a smithing table
# or generated by loot (chests, vaults, trial spawners).
limits:
  NETHERITE_HELMET: 1
  NETHERITE_CHESTPLATE: 1
  NETHERITE_LEGGINGS: 1
  NETHERITE_BOOTS: 1
  NETHERITE_SWORD: 1
  NETHERITE_PICKAXE: 1
  NETHERITE_AXE: 1
  NETHERITE_SHOVEL: 1
  NETHERITE_HOE: 1
  MACE: 2

# Combat logging protection.
# A player who damages or is damaged by another player is "in combat".
# Quitting while in combat kills them (they drop their items) and counts
# as a PvP death, so speed changes apply to both players.
combat:
  duration-seconds: 15
  # Commands that can't be used while in combat (without the leading slash).
  blocked-commands: [spawn, home, homes, tpa, tpahere, tpaccept, warp, back, tp, rtp, logout]
