name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -n 1)")
          echo "Building in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedSMP-plugin
          path: '**/build/libs/SpeedSMP-1.0.0.jar'
